# Builds and tests the plugin against a downloaded OIE distribution on a semver tag and
# stages a DRAFT GitHub Release with the unsigned zip + .sha256 sidecar.
#
#   git tag v2.8.1 && git push origin v2.8.1
#
# The draft is never published by CI. Release flow from here (see RELEASING.md):
# build and sign locally (YubiKey, -Psigning), replace the draft's zip AND regenerate
# its .sha256 sidecar from the signed zip, publish by hand, then submit the published
# release to the community catalog.
#
# The tag must match the version in every file that carries it (RELEASING.md, step 1),
# so CI builds the committed files as they are, the same way the signed build does, and
# plugin.xml's pluginVersion (what the engine reports as "installed") matches oie.json,
# keeping the store's update detection accurate. The engine version comes from the POM's
# mc.version (see build.yml for why it is not hardcoded here).
#
# A tag whose release is already published is refused, so re-running this workflow can
# never replace a published release's files with an unsigned build. An existing draft is
# updated: publishing it is the last, manual step.
#
# Two jobs, so the token that can write to the repository never shares a job with the
# build. The build job runs Maven, npm and every package they pull in with a read-only
# token, and uploads the zip. The release job holds the write token and runs only the
# steps below it: no checkout, no build tools and no action, just gh to download that zip
# and create or update the draft.

name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      asset: ${{ steps.pkg.outputs.asset }}
    steps:
      # The token is read-only here, but no later step needs git credentials either, so keep it
      # out of .git/config, where every later step, the npm install during the build included,
      # could read it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Check the tag against every version file
        id: ver
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          HELP=org.apache.maven.plugins:maven-help-plugin:3.5.1
          check() {
            if [ "$2" != "$VERSION" ]; then
              echo "::error::Tag ${GITHUB_REF_NAME} is version ${VERSION}, but $1 says '$2'."
              FAILED=1
            fi
          }
          FAILED=0
          check "pom.xml <revision>" "$(mvn -q -N "$HELP:evaluate" -Dexpression=revision -DforceStdout)"
          check "oie.json version" "$(jq -r .version oie.json)"
          # The engine loads a plugin only on the exact version in plugin.xml's mirthVersion (the
          # pom's plugin.supported.mc.versions), so the store listing must say exactly that version too.
          ENGINE="$(mvn -q -N "$HELP:evaluate" -Dexpression=plugin.supported.mc.versions -DforceStdout)"
          for field in minEngineVersion maxEngineVersion; do
            got="$(jq -r ".$field" oie.json)"
            if [ "$got" != "$ENGINE" ]; then
              echo "::error::oie.json $field is '${got}', but the plugin is built for OIE ${ENGINE} (pom.xml plugin.supported.mc.versions), the only version the engine will load it on."
              FAILED=1
            fi
          done
          if [ "$FAILED" -ne 0 ]; then
            echo "Set the version in every file listed above (RELEASING.md, step 1) and tag again."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Resolve the engine version from the POM
        id: engine
        run: |
          MC_VERSION="$(mvn -q -N org.apache.maven.plugins:maven-help-plugin:3.5.1:evaluate -Dexpression=mc.version -DforceStdout)"
          if [ -z "$MC_VERSION" ]; then
            echo "::error::Could not read mc.version from pom.xml"
            exit 1
          fi
          echo "mc_version=$MC_VERSION" >> "$GITHUB_OUTPUT"

      - name: Cache OIE distribution
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .oie-dist
          key: oie-dist-${{ steps.engine.outputs.mc_version }}

      # The same script build.yml and local builds use: it checks the distribution against
      # the SHA-256 in the POM before installing the engine jars from it.
      - name: Install engine jars into the local Maven repo
        env:
          OIE_DIST_CACHE: ${{ github.workspace }}/.oie-dist
        run: ./scripts/install-engine-jars.sh

      # Signing is skipped by default (no keystore in CI).
      - name: Build and test
        run: mvn -B -ntp package

      - name: Confirm tests actually ran
        run: |
          reports=$(find . -path '*/target/surefire-reports/*.xml' | wc -l)
          if [ "$reports" -eq 0 ]; then
            echo "::error::No surefire reports were produced. The test suite did not run."
            exit 1
          fi
          echo "surefire report files: $reports"

      # plugin.xml and webadmin/plugin.json get their version from the pom when the zip is
      # built. Check what actually went into the zip, so a broken filter can't ship a placeholder.
      - name: Check the version inside the zip
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          ZIP="package/target/simple-channel-history-${VERSION}.zip"
          XML="$(unzip -p "$ZIP" simple-channel-history/plugin.xml | sed -n 's:.*<pluginVersion>\(.*\)</pluginVersion>.*:\1:p')"
          JSON="$(unzip -p "$ZIP" simple-channel-history/webadmin/plugin.json | jq -r .version)"
          if [ "$XML" != "$VERSION" ] || [ "$JSON" != "$VERSION" ]; then
            echo "::error::The zip has plugin.xml '${XML}' and webadmin/plugin.json '${JSON}', but the tag is ${VERSION}."
            exit 1
          fi
          echo "plugin.xml and webadmin/plugin.json in the zip both say ${VERSION}"

      # Nothing else loads the CLIENT libraries plugin.xml names; only the Swing Administrator does.
      - name: Check the zip has every library plugin.xml names
        run: bash scripts/check-zip-libraries.sh "package/target/simple-channel-history-${{ steps.ver.outputs.version }}.zip"

      - name: Stage the release asset and checksum
        id: pkg
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          ASSET="simple-channel-history-${VERSION}.zip"
          SRC="package/target/${ASSET}"
          if [ ! -f "$SRC" ]; then
            echo "::error::${SRC} was not built"; ls -l package/target || true; exit 1
          fi
          mkdir -p out
          cp "$SRC" "out/${ASSET}"
          ( cd out && sha256sum "${ASSET}" > "${ASSET}.sha256" )
          echo "asset=${ASSET}" >> "$GITHUB_OUTPUT"

      - name: Upload the release asset and checksum for the release job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-zip
          path: out/
          if-no-files-found: error
          retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write    # create or update the draft release
      actions: read      # download the build job's artifact
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      ASSET: ${{ needs.build.outputs.asset }}
    steps:
      - name: Download the release asset and checksum
        run: |
          gh run download "$GITHUB_RUN_ID" --name release-zip --dir out
          ( cd out && sha256sum -c "${ASSET}.sha256" )

      - name: Create or update the DRAFT release
        # Stays a draft: the zip is unsigned. A human signs locally, replaces the
        # zip and its .sha256 sidecar, and publishes (see RELEASING.md).
        run: |
          if DRAFT="$(gh release view "$GITHUB_REF_NAME" --json isDraft -q .isDraft 2>&1)"; then
            if [ "$DRAFT" != "true" ]; then
              echo "::error::Release ${GITHUB_REF_NAME} is already published. Its files are never replaced; release a new version."
              exit 1
            fi
            echo "A draft exists for ${GITHUB_REF_NAME}; replacing its files."
            gh release upload "$GITHUB_REF_NAME" "out/${ASSET}" "out/${ASSET}.sha256" --clobber
          elif [ "$DRAFT" = "release not found" ]; then
            prerelease=()
            case "$GITHUB_REF_NAME" in *-*) prerelease=(--prerelease) ;; esac
            gh release create "$GITHUB_REF_NAME" "out/${ASSET}" "out/${ASSET}.sha256" \
              --draft --verify-tag --title "$GITHUB_REF_NAME" --notes "" "${prerelease[@]}"
          else
            # Anything else (network, permissions) must not be taken for "no release".
            echo "::error::Could not check for an existing release: $DRAFT"
            exit 1
          fi
