# Builds and tests the plugin against a downloaded OIE distribution on a semver tag and
# stages a DRAFT GitHub Release with the unsigned zip + .sha256 sidecar.
#
#   git tag v2.8.1 && git push origin v2.8.1
#
# The draft is never published by CI. Release flow from here (see RELEASING.md):
# build and sign locally (YubiKey, -Psigning), replace the draft's zip AND regenerate
# its .sha256 sidecar from the signed zip, publish by hand, then submit the published
# release to the community catalog.
#
# The tag must match the version in every file that carries it (RELEASING.md, step 1),
# so CI builds the committed files as they are, the same way the signed build does, and
# plugin.xml's pluginVersion (what the engine reports as "installed") matches oie.json,
# keeping the store's update detection accurate. The engine version comes from the POM's
# mc.version (see build.yml for why it is not hardcoded here).
#
# A tag whose release is already published is refused, so re-running this workflow can
# never replace a published release's files with an unsigned build. An existing draft is
# updated: publishing it is the last, manual step.

name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Refuse a tag whose release is already published
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if DRAFT="$(gh release view "$GITHUB_REF_NAME" --json isDraft -q .isDraft 2>&1)"; then
            if [ "$DRAFT" != "true" ]; then
              echo "::error::Release ${GITHUB_REF_NAME} is already published. Its files are never replaced; release a new version."
              exit 1
            fi
            echo "A draft exists for ${GITHUB_REF_NAME}; it will be updated."
          elif [ "$DRAFT" = "release not found" ]; then
            echo "No release exists for ${GITHUB_REF_NAME} yet."
          else
            # Anything else (network, permissions) must not be taken for "no release".
            echo "::error::Could not check for an existing release: $DRAFT"
            exit 1
          fi

      - name: Check the tag against every version file
        id: ver
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          HELP=org.apache.maven.plugins:maven-help-plugin:3.5.1
          check() {
            if [ "$2" != "$VERSION" ]; then
              echo "::error::Tag ${GITHUB_REF_NAME} is version ${VERSION}, but $1 says '$2'."
              FAILED=1
            fi
          }
          FAILED=0
          check "pom.xml <revision>" "$(mvn -q -N "$HELP:evaluate" -Dexpression=revision -DforceStdout)"
          check "oie.json version" "$(jq -r .version oie.json)"
          check "webadmin/plugin.json version" "$(jq -r .version webadmin/plugin.json)"
          check "webadmin/package.json version" "$(jq -r .version webadmin/package.json)"
          check "webadmin/package-lock.json version" "$(jq -r .version webadmin/package-lock.json)"
          check "webadmin/package-lock.json packages[\"\"].version" \
            "$(jq -r '.packages[""].version' webadmin/package-lock.json)"
          if [ "$FAILED" -ne 0 ]; then
            echo "Set the version in every file listed above (RELEASING.md, step 1) and tag again."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Resolve the engine version from the POM
        id: engine
        run: |
          MC_VERSION="$(mvn -q -N org.apache.maven.plugins:maven-help-plugin:3.5.1:evaluate -Dexpression=mc.version -DforceStdout)"
          if [ -z "$MC_VERSION" ]; then
            echo "::error::Could not read mc.version from pom.xml"
            exit 1
          fi
          echo "mc_version=$MC_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v${MC_VERSION}" >> "$GITHUB_OUTPUT"
          echo "tarball=oie_unix_${MC_VERSION//./_}.tar.gz" >> "$GITHUB_OUTPUT"

      - name: Cache OIE distribution
        id: oie-cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.engine.outputs.tarball }}
          key: oie-dist-${{ steps.engine.outputs.tag }}

      - name: Download OIE distribution (engine jars)
        if: steps.oie-cache.outputs.cache-hit != 'true'
        env:
          OIE_TAG: ${{ steps.engine.outputs.tag }}
          OIE_TARBALL: ${{ steps.engine.outputs.tarball }}
        run: curl -fSL -o "$OIE_TARBALL" "https://github.com/OpenIntegrationEngine/engine/releases/download/${OIE_TAG}/${OIE_TARBALL}"

      - name: Install engine jars into the local Maven repo
        env:
          OIE_TARBALL: ${{ steps.engine.outputs.tarball }}
          MC_VERSION: ${{ steps.engine.outputs.mc_version }}
        run: |
          tar xzf "$OIE_TARBALL"
          # groupId:artifactId:path-under-oie — the 12 jars this plugin's modules
          # depend on (scope provided). Installed at MC_VERSION to match pom.xml.
          JARS=(
            "com.mirth.connect:mirth-server:server-lib/mirth-server.jar"
            "com.mirth.connect:donkey-server:server-lib/donkey/donkey-server.jar"
            "com.mirth.connect:mirth-client-core:server-lib/mirth-client-core.jar"
            "com.mirth.connect:mirth-client:client-lib/mirth-client.jar"
            "com.mirth.connect.connectors:vm-shared:extensions/vm/vm-shared.jar"
            "com.mirth.connect.connectors:js-shared:extensions/js/js-shared.jar"
            "com.mirth.connect.connectors:tcp-shared:extensions/tcp/tcp-shared.jar"
            "com.mirth.connect.plugins:mllpmode-shared:extensions/mllpmode/mllpmode-shared.jar"
            "com.mirth.connect.plugins:http-shared:extensions/http/http-shared.jar"
            "com.mirth.connect.plugins:javascriptstep-shared:extensions/javascriptstep/javascriptstep-shared.jar"
            "com.mirth.connect.plugins.datatypes:datatype-raw-shared:extensions/datatype-raw/datatype-raw-shared.jar"
            "com.mirth.connect.plugins.datatypes:datatype-hl7v2-shared:extensions/datatype-hl7v2/datatype-hl7v2-shared.jar"
          )
          for entry in "${JARS[@]}"; do
            IFS=':' read -r group artifact rel <<< "$entry"
            jar="$GITHUB_WORKSPACE/oie/$rel"
            test -f "$jar" || { echo "::error::missing engine jar $rel in the OIE distribution"; exit 1; }
            mvn -B -ntp org.apache.maven.plugins:maven-install-plugin:3.1.4:install-file -Dfile="$jar" -DgroupId="$group" \
              -DartifactId="$artifact" -Dversion="$MC_VERSION" -Dpackaging=jar
          done

      # Signing is skipped by default (no keystore in CI).
      - name: Build and test
        run: mvn -B -ntp package

      - name: Confirm tests actually ran
        run: |
          reports=$(find . -path '*/target/surefire-reports/*.xml' | wc -l)
          if [ "$reports" -eq 0 ]; then
            echo "::error::No surefire reports were produced. The test suite did not run."
            exit 1
          fi
          echo "surefire report files: $reports"

      - name: Stage the release asset and checksum
        id: pkg
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          SRC="$(find package/target -maxdepth 1 -name 'simple-channel-history-*.zip' | head -n1)"
          if [ -z "$SRC" ]; then
            echo "::error::No simple-channel-history zip found in package/target/"; ls -l package/target || true; exit 1
          fi
          ASSET="simple-channel-history-${VERSION}.zip"
          mkdir -p out
          cp "$SRC" "out/${ASSET}"
          ( cd out && sha256sum "${ASSET}" > "${ASSET}.sha256" )
          echo "asset=${ASSET}" >> "$GITHUB_OUTPUT"

      - name: Create DRAFT GitHub Release with assets
        # Stays a draft: the zip is unsigned. A human signs locally, replaces the
        # zip and its .sha256 sidecar, and publishes (see RELEASING.md). Pinned
        # to v2.6.2 by commit.
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          draft: true
          files: |
            out/${{ steps.pkg.outputs.asset }}
            out/${{ steps.pkg.outputs.asset }}.sha256
          prerelease: ${{ contains(github.ref_name, '-') }}
