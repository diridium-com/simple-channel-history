#
# Builds and tests every push to main and every pull request. The e2e job then
# installs the built zip into the released engine and runs e2e/run.py on each
# database the engine supports.
#
# The engine jars this plugin compiles against are not on the public repsy
# mirror at 4.6.0, so they come from the published OIE distribution, the same
# tarball scripts/install-engine-jars.sh uses for local builds. The tarball is
# cached by tag, so it is downloaded once and reused until the pinned version
# changes.

name: Build

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.engine.outputs.tag }}
      tarball: ${{ steps.engine.outputs.tarball }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # The engine version lives in exactly one place, the POM's mc.version. Hardcoding
      # it here as well meant a future engine bump could leave CI installing old jars
      # while the build compiled against something else, with nothing to catch it.
      # The release tag and tarball name are mechanical transforms of that version, so
      # if OIE ever changes its asset naming the download 404s loudly rather than
      # resolving something stale.
      - name: Resolve the engine version from the POM
        id: engine
        run: |
          MC_VERSION="$(mvn -q -N org.apache.maven.plugins:maven-help-plugin:3.5.1:evaluate -Dexpression=mc.version -DforceStdout)"
          if [ -z "$MC_VERSION" ]; then
            echo "::error::Could not read mc.version from pom.xml"
            exit 1
          fi
          echo "mc_version=$MC_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v${MC_VERSION}" >> "$GITHUB_OUTPUT"
          echo "tarball=oie_unix_${MC_VERSION//./_}.tar.gz" >> "$GITHUB_OUTPUT"

      - name: Cache OIE distribution
        id: oie-cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.engine.outputs.tarball }}
          key: oie-dist-${{ steps.engine.outputs.tag }}

      - name: Download OIE distribution
        if: steps.oie-cache.outputs.cache-hit != 'true'
        env:
          OIE_TAG: ${{ steps.engine.outputs.tag }}
          OIE_TARBALL: ${{ steps.engine.outputs.tarball }}
        run: curl -fSL -o "$OIE_TARBALL" "https://github.com/OpenIntegrationEngine/engine/releases/download/${OIE_TAG}/${OIE_TARBALL}"

      # The same 12 jars scripts/install-engine-jars.sh installs locally.
      - name: Install engine jars into the local Maven repo
        env:
          OIE_TARBALL: ${{ steps.engine.outputs.tarball }}
          MC_VERSION: ${{ steps.engine.outputs.mc_version }}
        run: |
          # groupId:artifactId:path-under-oie, all scope provided.
          JARS=(
            "com.mirth.connect:mirth-server:server-lib/mirth-server.jar"
            "com.mirth.connect:donkey-server:server-lib/donkey/donkey-server.jar"
            "com.mirth.connect:mirth-client-core:server-lib/mirth-client-core.jar"
            "com.mirth.connect:mirth-client:client-lib/mirth-client.jar"
            "com.mirth.connect.connectors:vm-shared:extensions/vm/vm-shared.jar"
            "com.mirth.connect.connectors:js-shared:extensions/js/js-shared.jar"
            "com.mirth.connect.connectors:tcp-shared:extensions/tcp/tcp-shared.jar"
            "com.mirth.connect.plugins:mllpmode-shared:extensions/mllpmode/mllpmode-shared.jar"
            "com.mirth.connect.plugins:http-shared:extensions/http/http-shared.jar"
            "com.mirth.connect.plugins:javascriptstep-shared:extensions/javascriptstep/javascriptstep-shared.jar"
            "com.mirth.connect.plugins.datatypes:datatype-raw-shared:extensions/datatype-raw/datatype-raw-shared.jar"
            "com.mirth.connect.plugins.datatypes:datatype-hl7v2-shared:extensions/datatype-hl7v2/datatype-hl7v2-shared.jar"
          )
          members=()
          for entry in "${JARS[@]}"; do members+=("oie/${entry##*:}"); done
          tar xzf "$OIE_TARBALL" "${members[@]}"
          for entry in "${JARS[@]}"; do
            IFS=':' read -r group artifact rel <<< "$entry"
            mvn -B -ntp -q org.apache.maven.plugins:maven-install-plugin:3.1.4:install-file -Dfile="oie/$rel" -DgroupId="$group" \
              -DartifactId="$artifact" -Dversion="$MC_VERSION" -Dpackaging=jar
          done

      - name: Build and test
        run: mvn -B -ntp clean verify

      # A green build with zero tests run is the failure this guards against:
      # nothing about the build output would look wrong if the suite were skipped.
      - name: Confirm tests actually ran
        run: |
          reports=$(find . -path '*/target/surefire-reports/*.xml' | wc -l)
          if [ "$reports" -eq 0 ]; then
            echo "::error::No surefire reports were produced. The test suite did not run."
            exit 1
          fi
          echo "surefire report files: $reports"

      - name: Upload the plugin zip for the e2e job
        uses: actions/upload-artifact@v4
        with:
          name: plugin-zip
          path: package/target/simple-channel-history-*.zip
          if-no-files-found: error
          retention-days: 7

  # Installs the zip into the released OIE engine through its own installer, the way a
  # user would, and runs the scenarios in e2e/run.py: fresh install, upgrade from each
  # release in e2e/upgrade-sources.txt, and uninstall. One job per database.
  e2e:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        db: [derby, postgres, mysql, sqlserver, sqlserver-ms, oracle]
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Restore only: the build job saves this cache, and six jobs saving the same key race.
      - name: Restore OIE distribution
        uses: actions/cache/restore@v4
        with:
          path: ${{ needs.build.outputs.tarball }}
          key: oie-dist-${{ needs.build.outputs.tag }}

      # The build job only compiles against jars from the tarball. Here the whole engine
      # runs, so the tarball is checked against the release's own sha256sums first.
      - name: Download and verify OIE distribution
        env:
          OIE_TAG: ${{ needs.build.outputs.tag }}
          OIE_TARBALL: ${{ needs.build.outputs.tarball }}
        run: |
          base="https://github.com/OpenIntegrationEngine/engine/releases/download/${OIE_TAG}"
          if [ ! -f "$OIE_TARBALL" ]; then
            curl -fSL -o "$OIE_TARBALL" "${base}/${OIE_TARBALL}"
          fi
          curl -fsSL -o sha256sums "${base}/sha256sums"
          expected="$(awk -v f="$OIE_TARBALL" '{ n = $2; sub(/^\*/, "", n) } n == f { print $1 }' sha256sums)"
          if [ -z "$expected" ]; then
            echo "::error::${OIE_TARBALL} is not listed in the release's sha256sums"
            exit 1
          fi
          echo "${expected}  ${OIE_TARBALL}" | sha256sum -c -

      - name: Download the plugin zip
        uses: actions/download-artifact@v4
        with:
          name: plugin-zip
          path: plugin-zip

      - name: Run the e2e scenarios
        env:
          DB: ${{ matrix.db }}
          OIE_TARBALL: ${{ needs.build.outputs.tarball }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          zips=(plugin-zip/simple-channel-history-*.zip)
          if [ "${#zips[@]}" -ne 1 ] || [ ! -f "${zips[0]}" ]; then
            echo "::error::expected exactly one plugin zip, found: ${zips[*]}"
            exit 1
          fi
          python3 e2e/run.py --db "$DB" --zip "${zips[0]}" --tarball "$OIE_TARBALL" --work "$RUNNER_TEMP/e2e"

      - name: Upload engine logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs-${{ matrix.db }}
          path: |
            ${{ runner.temp }}/e2e/*/oie/logs/
            ${{ runner.temp }}/e2e/*/oie/console-*.log
          if-no-files-found: ignore
          retention-days: 7
